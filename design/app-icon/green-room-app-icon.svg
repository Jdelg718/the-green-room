<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Green Room app icon</title>
  <desc id="desc">The approved GR double-slash mark on a black backstage card with an electric green cue light.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#121411" stroke-opacity="0.07" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="18" dy="24" stdDeviation="0" flood-color="#121411" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Opaque full-bleed canvas; iOS supplies the rounded mask. -->
  <rect width="1024" height="1024" fill="#f3efdf"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <rect y="0" width="1024" height="42" fill="#121411"/>
  <rect y="42" width="1024" height="18" fill="#b9ff29"/>
  <rect y="964" width="1024" height="18" fill="#b9ff29"/>
  <rect y="982" width="1024" height="42" fill="#121411"/>

  <g transform="rotate(-3 512 512)" filter="url(#shadow)">
    <rect x="142" y="142" width="740" height="740" fill="#121411"/>
    <rect x="142" y="142" width="740" height="740" fill="none" stroke="#121411" stroke-width="10"/>
    <path d="M210 740H814" stroke="#ed4f37" stroke-width="24"/>
    <text x="512" y="600" text-anchor="middle" fill="#b9ff29"
      font-family="SFMono-Heavy, SFMono-Regular, Menlo, Monaco, 'Courier New', monospace"
      font-size="246" font-weight="900" letter-spacing="-22">GR//</text>
    <circle cx="874" cy="132" r="42" fill="#b9ff29" stroke="#121411" stroke-width="16"/>
  </g>
</svg>
