name: Clean-source evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-source-evidence-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  clean-source:
    name: clean-source-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-14-arm64
            os: macos-14
            expected_platform: darwin
            expected_arch: arm64
          - target: ubuntu-24.04-x64
            os: ubuntu-24.04
            expected_platform: linux
            expected_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOURCE_REPOSITORY: Jdelg718/the-green-room
      SOURCE_URL: https://github.com/Jdelg718/the-green-room.git
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REF_PROTECTED: ${{ github.ref_protected }}
      EVIDENCE_USER: greenroomci
      TRUSTED_CHECKOUT: ${{ github.workspace }}/trusted-source

    steps:
      - name: Initialize platform-scoped evidence paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          if [[ "$RUNNER_OS" = macOS ]]; then
            evidence_parent=/private/tmp
          else
            evidence_parent=/tmp
          fi
          evidence_root="$evidence_parent/greenroom-clean-source-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ strategy.job-index }}"
          test "$(realpath "$evidence_parent")" = "$evidence_parent"
          sudo test ! -e "$evidence_root"
          printf 'EVIDENCE_ROOT=%s\nUPLOAD_ROOT=%s\n' \
            "$evidence_root" \
            "$RUNNER_TEMP/greenroom-clean-source-upload" >> "$GITHUB_ENV"

      - name: Require a protected-main dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_REF_PROTECTED" = true
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out the trusted finalizer source at the dispatched SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the trusted runner checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(realpath "$TRUSTED_CHECKOUT")" = "$TRUSTED_CHECKOUT"
          test "$(git -C "$TRUSTED_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$TRUSTED_CHECKOUT" status --porcelain)"
          trusted_origin="$(git -C "$TRUSTED_CHECKOUT" remote get-url origin)"
          case "$trusted_origin" in
            https://github.com/Jdelg718/the-green-room|https://github.com/Jdelg718/the-green-room.git) ;;
            *) echo "unexpected trusted checkout origin: $trusted_origin" >&2; exit 1 ;;
          esac
          test -f "$TRUSTED_CHECKOUT/scripts/clean-source-evidence.mjs"

      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Set up uv 0.12.8
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.8
          enable-cache: false

      - name: Prepare a globally readable exact toolchain and snapshot utility
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.20.0
          test "$(npm --version)" = 11.19.0
          [[ "$(uv --version)" =~ ^uv\ 0\.12\.8($|\ ) ]]
          test "$(node -p 'process.platform')" = "${{ matrix.expected_platform }}"
          test "$(node -p 'process.arch')" = "${{ matrix.expected_arch }}"
          npm_root="$(npm root --global)/npm"
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo rm -rf /usr/local/lib/node_modules/npm
          sudo install -d -m 0755 /usr/local/lib/node_modules
          sudo cp -R "$npm_root" /usr/local/lib/node_modules/npm
          sudo ln -sfn ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm
          sudo ln -sfn ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx
          sudo install -m 0755 "$(command -v uv)" /usr/local/bin/uv
          sudo tee /usr/local/bin/greenroom-user-owned-snapshot >/dev/null <<'NODE'
          #!/usr/local/bin/node
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const [uidText, outputPath, errorsPath, ...requestedRoots] = process.argv.slice(2);
          const uid = Number(uidText);
          const errors = [];
          const entries = new Map();
          const roots = [];
          const reportError = (operation, target, error) => errors.push(`${operation}\t${target}\t${error.code ?? error.name ?? "ERROR"}\t${error.message}`);
          const canonicalPath = (target) => target === "/" ? "/" : path.join(fs.realpathSync(path.dirname(target)), path.basename(target));
          const typeOf = (stat) => stat.isFile() ? "regular" : stat.isDirectory() ? "directory" : stat.isSymbolicLink() ? "symlink" : stat.isSocket() ? "socket" : stat.isFIFO() ? "fifo" : stat.isCharacterDevice() ? "character-device" : stat.isBlockDevice() ? "block-device" : "other";
          const visit = (target, rootDevice, rootState) => {
            let stat;
            try { stat = fs.lstatSync(target, { bigint: true }); }
            catch (error) { reportError("lstat", target, error); rootState.traversed = false; return; }
            let canonical;
            try { canonical = canonicalPath(target); }
            catch (error) { reportError("realpath-parent", target, error); rootState.traversed = false; return; }
            if (Number(stat.uid) === uid) {
              const entry = {
                canonicalPath: canonical,
                type: typeOf(stat),
                uid: Number(stat.uid),
                gid: Number(stat.gid),
                mode: `0${(Number(stat.mode) & 0o7777).toString(8).padStart(4, "0")}`,
                device: stat.dev.toString(),
                inode: stat.ino.toString(),
                linkCount: stat.nlink.toString(),
                size: stat.size.toString(),
                mtimeNs: stat.mtimeNs.toString(),
              };
              try {
                if (stat.isFile()) entry.sha256 = crypto.createHash("sha256").update(fs.readFileSync(target)).digest("hex");
                if (stat.isSymbolicLink()) entry.symlinkTarget = fs.readlinkSync(target);
              } catch (error) { reportError(stat.isFile() ? "sha256" : "readlink", target, error); rootState.traversed = false; }
              const previous = entries.get(canonical);
              if (previous && JSON.stringify(previous) !== JSON.stringify(entry)) {
                reportError("canonical-collision", canonical, new Error("different metadata for the same canonical path"));
                rootState.traversed = false;
              } else entries.set(canonical, entry);
            }
            if (!stat.isDirectory() || stat.dev !== rootDevice) return;
            let names;
            try { names = fs.readdirSync(target).sort(); }
            catch (error) { reportError("readdir", target, error); rootState.traversed = false; return; }
            for (const name of names) visit(path.join(target, name), rootDevice, rootState);
          };
          if (!Number.isSafeInteger(uid) || uid <= 0 || requestedRoots.length === 0) throw new Error("usage: snapshot UID OUTPUT ERRORS ROOT...");
          for (const requestedRoot of requestedRoots) {
            const normalized = path.resolve(requestedRoot);
            const state = { path: normalized, device: null, traversed: true, sameDeviceOnly: true };
            roots.push(state);
            try {
              const rootStat = fs.lstatSync(normalized, { bigint: true });
              state.device = rootStat.dev.toString();
              visit(normalized, rootStat.dev, state);
            } catch (error) { reportError("root", normalized, error); state.traversed = false; }
          }
          const snapshot = { schemaVersion: 1, uid, complete: errors.length === 0 && roots.every((root) => root.traversed), roots, entries: [...entries.values()].sort((a, b) => a.canonicalPath.localeCompare(b.canonicalPath)) };
          fs.writeFileSync(outputPath, `${JSON.stringify(snapshot, null, 2)}\n`, { mode: 0o600 });
          fs.writeFileSync(errorsPath, errors.length === 0 ? "" : `${errors.join("\n")}\n`, { mode: 0o600 });
          NODE
          sudo chmod 0755 /usr/local/bin/greenroom-user-owned-snapshot
          sudo tee /usr/local/bin/greenroom-tree-manifest >/dev/null <<'NODE'
          #!/usr/local/bin/node
          const fs = require("node:fs"), path = require("node:path"), crypto = require("node:crypto");
          const [root, output] = process.argv.slice(2);
          const entries = [];
          const visit = (target) => {
            const stat = fs.lstatSync(target, { bigint: true });
            const entry = { path: target, uid: Number(stat.uid), gid: Number(stat.gid), mode: `0${(Number(stat.mode)&0o7777).toString(8).padStart(4,"0")}`, type: stat.isDirectory()?"directory":stat.isFile()?"regular":stat.isSymbolicLink()?"symlink":"other", size: stat.size.toString(), mtimeNs: stat.mtimeNs.toString() };
            if (stat.isFile()) entry.sha256 = crypto.createHash("sha256").update(fs.readFileSync(target)).digest("hex");
            if (stat.isSymbolicLink()) entry.symlinkTarget = fs.readlinkSync(target);
            entries.push(entry);
            if (stat.isDirectory()) for (const name of fs.readdirSync(target).sort()) visit(path.join(target, name));
          };
          if (path.resolve(root) !== root || fs.realpathSync(root) !== root) throw new Error("manifest root must be canonical");
          visit(root);
          fs.writeFileSync(output, `${JSON.stringify({ schemaVersion: 1, root, entries }, null, 2)}\n`, { mode: 0o600, flag: "wx" });
          NODE
          sudo chmod 0755 /usr/local/bin/greenroom-tree-manifest
          if [[ "$RUNNER_OS" = macOS ]]; then
            sudo tee /private/tmp/greenroom-darwin-proc-path.c >/dev/null <<'C'
          #include <libproc.h>
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
            if (argc != 2) return 64;
            char path[PROC_PIDPATHINFO_MAXSIZE];
            if (proc_pidpath(atoi(argv[1]), path, sizeof(path)) <= 0) return 1;
            puts(path);
            return 0;
          }
          C
            sudo /usr/bin/xcrun clang -Wall -Wextra -Werror /private/tmp/greenroom-darwin-proc-path.c -o /usr/local/bin/greenroom-darwin-proc-path
            sudo chmod 0755 /usr/local/bin/greenroom-darwin-proc-path
            sudo rm -f /private/tmp/greenroom-darwin-proc-path.c
          fi
          sudo tee /usr/local/bin/greenroom-uid-process-inventory >/dev/null <<'NODE'
          #!/usr/local/bin/node
          const fs = require("node:fs"), cp = require("node:child_process");
          const [uidText, output] = process.argv.slice(2), uid = Number(uidText);
          const pids = cp.execFileSync("/bin/ps", ["-axo", "uid=,pid="], { encoding: "utf8" }).split("\n").flatMap((line) => {
            const match = line.match(/^\s*(\d+)\s+(\d+)\s*$/);
            return match && Number(match[1]) === uid ? [Number(match[2])] : [];
          });
          const linuxInventory = (pid) => {
            const stat = () => fs.readFileSync(`/proc/${pid}/stat`, "utf8").match(/^\d+ \(.*\) (.*)$/)[1].split(" ");
            const before = stat();
            const executablePath = fs.readlinkSync(`/proc/${pid}/exe`);
            const argv = fs.readFileSync(`/proc/${pid}/cmdline`).toString("utf8").replaceAll("\0", " ").trim();
            const after = stat();
            if (before[19] !== after[19] || before[1] !== after[1] || !argv) throw new Error(`process identity changed during capture for PID ${pid}`);
            return { pid, startTime: before[19], ppid: Number(before[1]), executablePath, argv };
          };
          const darwinInventory = (pid) => {
            const capture = () => {
              const line = cp.execFileSync("/bin/ps", ["-ww", "-p", String(pid), "-o", "ppid=", "-o", "lstart=", "-o", "args="], { encoding: "utf8" }).trim();
              const match = line.match(/^\s*(\d+)\s+((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+\d{4})\s+(.+)$/);
              if (!match) throw new Error(`incomplete Darwin process inventory for PID ${pid}`);
              const executablePath = cp.execFileSync("/usr/local/bin/greenroom-darwin-proc-path", [String(pid)], { encoding: "utf8" }).trim();
              if (!executablePath || !match[3]) throw new Error(`incomplete Darwin process inventory for PID ${pid}`);
              return { pid, startTime: match[2].split(/\s+/).join(" "), ppid: Number(match[1]), executablePath, argv: match[3] };
            };
            const before = capture(), after = capture();
            if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error(`process identity changed during capture for PID ${pid}`);
            return after;
          };
          const processes = pids.map((pid) => process.platform === "darwin" ? darwinInventory(pid) : linuxInventory(pid)).sort((a,b)=>a.pid-b.pid);
          fs.writeFileSync(output, `${JSON.stringify({ schemaVersion: 2, uid, capturedAt: new Date().toISOString(), processes }, null, 2)}\n`, { mode: 0o600, flag: "wx" });
          NODE
          sudo chmod 0755 /usr/local/bin/greenroom-uid-process-inventory
          EVIDENCE_TOOL_PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(env PATH="$EVIDENCE_TOOL_PATH" node --version)" = v24.20.0
          test "$(env PATH="$EVIDENCE_TOOL_PATH" npm --version)" = 11.19.0
          [[ "$(env PATH="$EVIDENCE_TOOL_PATH" uv --version)" =~ ^uv\ 0\.12\.8($|\ ) ]]
          printf 'EVIDENCE_TOOL_PATH=%s\n' "$EVIDENCE_TOOL_PATH" >> "$GITHUB_ENV"

      - name: Create, relocate, and verify a separate non-admin evidence user
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" = macOS ]]; then control_parent=/private/var/root; ROOT_GROUP=wheel; else control_parent=/root; ROOT_GROUP=root; fi
          CONTROL_ROOT="$control_parent/greenroom-clean-source-control-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ strategy.job-index }}"
          test "$(realpath "$control_parent")" = "$control_parent"
          sudo test ! -e "$CONTROL_ROOT"
          sudo install -d -m 0700 -o root -g "$ROOT_GROUP" "$CONTROL_ROOT"
          if [[ "$RUNNER_OS" = macOS ]]; then
            uid=550
            while dscl . -search /Users UniqueID "$uid" | grep -q .; do uid=$((uid + 1)); done
            EVIDENCE_HOME="/Users/$EVIDENCE_USER"
            sudo dscl . -create "/Users/$EVIDENCE_USER"
            sudo dscl . -create "/Users/$EVIDENCE_USER" UniqueID "$uid"
            sudo dscl . -create "/Users/$EVIDENCE_USER" PrimaryGroupID 20
            sudo dscl . -create "/Users/$EVIDENCE_USER" NFSHomeDirectory "$EVIDENCE_HOME"
            sudo dscl . -create "/Users/$EVIDENCE_USER" UserShell /usr/bin/false
            sudo dscl . -create "/Users/$EVIDENCE_USER" RealName "Green Room evidence user"
            sudo dscl . -create "/Users/$EVIDENCE_USER" Password '*'
            sudo dscl . -create "/Users/$EVIDENCE_USER" AuthenticationAuthority ';DisabledUser;'
            sudo createhomedir -c -u "$EVIDENCE_USER"
          else
            sudo useradd --create-home --shell /usr/sbin/nologin --user-group "$EVIDENCE_USER"
            sudo passwd --lock "$EVIDENCE_USER"
            EVIDENCE_HOME="/home/$EVIDENCE_USER"
          fi
          EVIDENCE_UID="$(id -u "$EVIDENCE_USER")"
          EVIDENCE_GID="$(id -g "$EVIDENCE_USER")"
          EVIDENCE_GROUP="$(id -gn "$EVIDENCE_USER")"
          sudo chmod 0700 "$EVIDENCE_HOME"
          sudo greenroom-tree-manifest "$EVIDENCE_HOME" "$CONTROL_ROOT/placeholder-home-initial.json"
          EVIDENCE_SOURCE_HOME="$EVIDENCE_ROOT/home"
          EVIDENCE_SOURCE_TMP="$EVIDENCE_SOURCE_HOME/tmp"
          sudo install -d -m 0700 -o "$EVIDENCE_USER" -g "$EVIDENCE_GID" "$EVIDENCE_ROOT" "$EVIDENCE_SOURCE_HOME" "$EVIDENCE_SOURCE_TMP"
          if [[ "$RUNNER_OS" = macOS ]]; then
            sudo dscl . -change "/Users/$EVIDENCE_USER" NFSHomeDirectory "$EVIDENCE_HOME" "$EVIDENCE_SOURCE_HOME"
            sudo dscacheutil -flushcache
            test "$(sudo dscl . -read "/Users/$EVIDENCE_USER" NFSHomeDirectory)" = "NFSHomeDirectory: $EVIDENCE_SOURCE_HOME"
            FOUNDATION_HOME="$(sudo -u "$EVIDENCE_USER" env HOME="$EVIDENCE_SOURCE_HOME" TMPDIR="$EVIDENCE_SOURCE_TMP" \
              /bin/bash --noprofile --norc -c 'cd "$HOME" && exec /usr/bin/swift -e '\''import Foundation; print(NSHomeDirectory())'\''')"
            test "$FOUNDATION_HOME" = "$EVIDENCE_SOURCE_HOME"
            if sudo dseditgroup -o checkmember -m "$EVIDENCE_USER" admin | grep -q yes; then exit 1; fi
          else
            FOUNDATION_HOME=""
            ! id -nG "$EVIDENCE_USER" | tr ' ' '\n' | grep -Eq '^(sudo|adm|wheel)$'
          fi
          evidence_run() {
            sudo -u "$EVIDENCE_USER" env HOME="$EVIDENCE_SOURCE_HOME" TMPDIR="$EVIDENCE_SOURCE_TMP" \
              /bin/bash --noprofile --norc -c 'cd "$HOME" && exec "$@"' _ "$@"
          }
          EFFECTIVE_HOME="$(evidence_run /usr/local/bin/node -p 'require("node:os").userInfo().homedir')"
          EXPORTED_HOME="$(evidence_run /usr/bin/printenv HOME)"
          test "$EXPORTED_HOME" = "$EVIDENCE_SOURCE_HOME"
          if [[ "$RUNNER_OS" = macOS ]]; then test "$EFFECTIVE_HOME" = "$EVIDENCE_SOURCE_HOME"; else test "$EFFECTIVE_HOME" = "$EVIDENCE_HOME"; fi
          sudo /usr/local/bin/node -e '
            const fs=require("node:fs"); const [output,platform,original,effective,exported,foundation,uid,gid,ownerName,groupName]=process.argv.slice(1);
            const details=(p)=>{const s=fs.lstatSync(p); return { path:p, canonicalPath:fs.realpathSync(p), uid:s.uid, gid:s.gid, ownerName, groupName, mode:`0${(s.mode&0o7777).toString(8).padStart(4,"0")}` }};
            const homeMetadata={ placeholder:details(original), synthetic:details(exported) };
            if(homeMetadata.placeholder.mode!=="00700"||homeMetadata.synthetic.mode!=="00700"||homeMetadata.placeholder.uid!==Number(uid)||homeMetadata.synthetic.uid!==Number(uid)||homeMetadata.placeholder.gid!==Number(gid)||homeMetadata.synthetic.gid!==Number(gid)) process.exit(1);
            fs.writeFileSync(output,JSON.stringify({schemaVersion:1,platform,originalHome:original,effectiveHome:effective,exportedHome:exported,foundationHome:foundation||null,homeMetadata,warmCommands:[],stabilization:{attempts:0,consecutiveStableSnapshots:0,accepted:false}},null,2)+"\n",{mode:0o600,flag:"wx"});
          ' "$CONTROL_ROOT/provisioning-evidence.json" "${{ matrix.expected_platform }}" "$EVIDENCE_HOME" "$EFFECTIVE_HOME" "$EXPORTED_HOME" "$FOUNDATION_HOME" "$EVIDENCE_UID" "$EVIDENCE_GID" "$EVIDENCE_USER" "$EVIDENCE_GROUP"
          if evidence_run /usr/bin/test -r "$CONTROL_ROOT" || evidence_run /usr/bin/test -w "$CONTROL_ROOT" || evidence_run /usr/bin/test -x "$CONTROL_ROOT"; then exit 1; fi
          case "$CONTROL_ROOT/" in "$EVIDENCE_ROOT/"*) exit 1;; esac
          printf 'EVIDENCE_HOME=%s\nEVIDENCE_SOURCE_HOME=%s\nEVIDENCE_SOURCE_TMP=%s\nEVIDENCE_UID=%s\nCONTROL_ROOT=%s\nROOT_GROUP=%s\nFOUNDATION_HOME=%s\n' "$EVIDENCE_HOME" "$EVIDENCE_SOURCE_HOME" "$EVIDENCE_SOURCE_TMP" "$EVIDENCE_UID" "$CONTROL_ROOT" "$ROOT_GROUP" "$FOUNDATION_HOME" >> "$GITHUB_ENV"
          test "$EVIDENCE_UID" -ne 0

      - name: Warm trusted prerequisites and stabilize the pre-source baseline
        shell: bash
        run: |
          set -euo pipefail
          audit="$CONTROL_ROOT/audit-before.json"
          if [[ "$RUNNER_OS" = macOS ]]; then
            roots=(/Users /private/tmp /private/var /Applications /Library /usr/local /Volumes)
            mounts="$CONTROL_ROOT/macos-mounts-before.json"
            /sbin/mount | sudo /usr/local/bin/node -e '
              const fs=require("node:fs"); const output=process.argv[1]; let input=""; process.stdin.setEncoding("utf8"); process.stdin.on("data",c=>input+=c); process.stdin.on("end",()=>{const monitored=["/Users","/private/tmp","/private/var","/Applications","/Library","/usr/local","/Volumes"]; const writableNestedMounts=input.split("\n").flatMap(line=>{const m=line.match(/ on (.+) \(([^)]+)\)$/); if(!m)return[]; const options=m[2].split(",").map(x=>x.trim()); return monitored.some(root=>m[1].startsWith(`${root}/`))&&!options.includes("read-only")?[{path:m[1],options,line}]:[]}); fs.writeFileSync(output,JSON.stringify({schemaVersion:1,monitoredRoots:monitored,writableNestedMounts},null,2)+"\n",{mode:0o600,flag:"wx"});});
            ' "$mounts"
            sudo /usr/local/bin/node -e 'if(require(process.argv[1]).writableNestedMounts.length!==0)process.exit(1)' "$mounts"
          else
            roots=(/ /home /tmp /var/tmp /opt /usr/local /run)
          fi
          warm_log="$CONTROL_ROOT/warm-commands.tsv"
          sudo touch "$warm_log"; sudo chmod 0600 "$warm_log"
          warm() {
            local command="$1" status
            set +e
            sudo -u "$EVIDENCE_USER" env HOME="$EVIDENCE_SOURCE_HOME" TMPDIR="$EVIDENCE_SOURCE_TMP" PATH="$EVIDENCE_TOOL_PATH" \
              /bin/bash --noprofile --norc -c 'cd "$HOME" && /bin/bash --noprofile --norc -c "$1"' _ "$command"
            status=$?
            set -e
            printf '%s\t%s\n' "$status" "$command" | sudo tee -a "$warm_log" >/dev/null
            test "$status" -eq 0
          }
          warm 'node --version'
          warm 'npm --version'
          warm 'uv --version'
          if [[ "$RUNNER_OS" = macOS ]]; then
            warm '/usr/bin/defaults read NSGlobalDomain >/dev/null'
            warm '/usr/bin/security list-keychains -d user >/dev/null'
            warm '/usr/bin/xcrun --find clang >/dev/null'
            warm '/usr/bin/xcodebuild -version >/dev/null'
            warm 'mkdir -p "$HOME/.greenroom-warm" && /usr/bin/xcrun clang -x c -c /dev/null -o "$HOME/.greenroom-warm/empty.o" && rm -rf "$HOME/.greenroom-warm"'
          fi
          warm 'git ls-remote https://github.com/git/git.git HEAD >/dev/null'
          previous=""; accepted=false; attempts=0
          for attempt in 1 2 3 4 5; do
            attempts=$attempt
            sleep 3
            current="$CONTROL_ROOT/stabilization-$attempt.json"
            current_errors="$CONTROL_ROOT/stabilization-$attempt-errors.log"
            sudo env PATH="$EVIDENCE_TOOL_PATH" greenroom-user-owned-snapshot "$EVIDENCE_UID" "$current" "$current_errors" "${roots[@]}"
            sudo test ! -s "$current_errors"
            sudo /usr/local/bin/node -e 'const s=require(process.argv[1]);if(s.complete!==true||!s.roots.every(r=>r.traversed===true&&r.sameDeviceOnly===true))process.exit(1)' "$current"
            if [[ -n "$previous" ]] && sudo /usr/local/bin/node -e '
              const path=require("node:path"); const [a,b,root]=process.argv.slice(1); const outside=s=>s.entries.filter(e=>e.canonicalPath!==root&&!e.canonicalPath.startsWith(root+path.sep)); const x=require(a),y=require(b); if(JSON.stringify(x.roots)!==JSON.stringify(y.roots)||JSON.stringify(outside(x))!==JSON.stringify(outside(y)))process.exit(1);
            ' "$previous" "$current" "$EVIDENCE_ROOT"; then
              sudo cp "$current" "$audit"
              sudo cp "$current_errors" "$CONTROL_ROOT/audit-before-errors.log"
              accepted=true
              break
            fi
            previous="$current"
          done
          test "$accepted" = true
          sudo greenroom-uid-process-inventory "$EVIDENCE_UID" "$CONTROL_ROOT/processes-baseline.json"
          sudo /usr/local/bin/node -e '
            const fs=require("node:fs"); const [file,warm,attempts]=process.argv.slice(1); const p=require(file); p.warmCommands=fs.readFileSync(warm,"utf8").trim().split("\n").filter(Boolean).map(line=>{const i=line.indexOf("\t");return{command:line.slice(i+1),status:Number(line.slice(0,i))}}); p.stabilization={attempts:Number(attempts),consecutiveStableSnapshots:2,accepted:true,authoritativeSnapshot:"audit-before.json"}; fs.writeFileSync(file,JSON.stringify(p,null,2)+"\n");
          ' "$CONTROL_ROOT/provisioning-evidence.json" "$warm_log" "$attempts"
          for control_file in "$CONTROL_ROOT/audit-before.json" "$CONTROL_ROOT/audit-before-errors.log" "$CONTROL_ROOT/processes-baseline.json" "$CONTROL_ROOT/provisioning-evidence.json"; do
            sudo /usr/local/bin/node -e 'const fs=require("node:fs"),s=fs.lstatSync(process.argv[1]);if(s.uid!==0||(s.mode&0o777)!==0o600||!s.isFile())process.exit(1)' "$control_file"
            if sudo -u "$EVIDENCE_USER" test -r "$control_file" || sudo -u "$EVIDENCE_USER" test -w "$control_file"; then exit 1; fi
          done

      - name: Public-clone and run the exact dispatched source as the evidence user
        shell: bash
        run: |
          set -euo pipefail
          checkout="$EVIDENCE_ROOT/checkout"
          evidence="$EVIDENCE_ROOT/evidence"
          data_root="$EVIDENCE_ROOT/disposable-data"
          sudo -u "$EVIDENCE_USER" env \
            HOME="$EVIDENCE_SOURCE_HOME" \
            TMPDIR="$EVIDENCE_SOURCE_TMP" \
            PATH="$EVIDENCE_TOOL_PATH" \
            GREENROOM_ORIGINAL_HOME="$EVIDENCE_HOME" \
            GREENROOM_FOUNDATION_HOME="$FOUNDATION_HOME" \
            SOURCE_URL="$SOURCE_URL" \
            SOURCE_SHA="$SOURCE_SHA" \
            SOURCE_REF="$GITHUB_REF" \
            SOURCE_REF_PROTECTED="$SOURCE_REF_PROTECTED" \
            CHECKOUT="$checkout" \
            EVIDENCE="$evidence" \
            DATA_ROOT="$data_root" \
            WORK_ROOT="$EVIDENCE_ROOT" \
            /bin/bash -c '
              set -euo pipefail
              test ! -e "$CHECKOUT"
              git clone --filter=blob:none --no-checkout "$SOURCE_URL" "$CHECKOUT"
              git -C "$CHECKOUT" checkout --detach "$SOURCE_SHA"
              test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
              git -C "$CHECKOUT" merge-base --is-ancestor "$SOURCE_SHA" origin/main
              exec node "$CHECKOUT/scripts/clean-source-evidence.mjs" run \
                --repo-root="$CHECKOUT" \
                --evidence-root="$EVIDENCE" \
                --work-root="$WORK_ROOT" \
                --data-root="$DATA_ROOT" \
                --repository=Jdelg718/the-green-room \
                --sha="$SOURCE_SHA"
            '

      - name: Audit source-phase writes and finalize machine-readable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CONTROL_ROOT:-}" || -z "${EVIDENCE_UID:-}" || -z "${ROOT_GROUP:-}" ]] || ! sudo test -d "$CONTROL_ROOT"; then
            mkdir -p "$UPLOAD_ROOT"
            printf 'setup failed before the root control plane was available\n' > "$UPLOAD_ROOT/setup-failure.txt"
            exit 1
          fi
          process_before_snapshot="$CONTROL_ROOT/processes-before-after-snapshot.json"
          sudo greenroom-uid-process-inventory "$EVIDENCE_UID" "$process_before_snapshot"
          after="$CONTROL_ROOT/audit-after.json"
          errors="$CONTROL_ROOT/audit-after-errors.log"
          if [[ "$RUNNER_OS" = macOS ]]; then
            roots=(/Users /private/tmp /private/var /Applications /Library /usr/local /Volumes)
            mounts="$CONTROL_ROOT/macos-mounts-after.json"
            /sbin/mount | sudo /usr/local/bin/node -e '
              const fs = require("node:fs");
              const output = process.argv[1];
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const monitored = ["/Users", "/private/tmp", "/private/var", "/Applications", "/Library", "/usr/local", "/Volumes"];
                const writableNested = input.split("\n").flatMap((line) => {
                  const match = line.match(/ on (.+) \(([^)]+)\)$/);
                  if (!match) return [];
                  const path = match[1];
                  const options = match[2].split(",").map((option) => option.trim());
                  return monitored.some((root) => path.startsWith(`${root}/`)) && !options.includes("read-only") ? [{ path, options, line }] : [];
                }).sort((left, right) => left.path.localeCompare(right.path));
                fs.writeFileSync(output, `${JSON.stringify({ schemaVersion: 1, monitoredRoots: monitored, writableNestedMounts: writableNested }, null, 2)}\n`, { mode: 0o600, flag: "wx" });
              });
            ' "$mounts"
            sudo chmod 0600 "$mounts"
            sudo /usr/local/bin/node -e 'const m=require(process.argv[1]); if(m.writableNestedMounts.length!==0) process.exit(1)' "$mounts"
          else
            roots=(/ /home /tmp /var/tmp /opt /usr/local /run)
          fi
          sudo env PATH="$EVIDENCE_TOOL_PATH" greenroom-user-owned-snapshot "$EVIDENCE_UID" "$after" "$errors" "${roots[@]}"
          sudo chmod 0600 "$after" "$errors"
          if ! sudo test ! -s "$errors"; then sudo cat "$errors" >&2; exit 1; fi
          sudo /usr/local/bin/node -e 'const s=require(process.argv[1]);if(s.complete!==true||!s.roots.every(r=>r.traversed===true&&r.sameDeviceOnly===true))process.exit(1)' "$after"
          process_after="$CONTROL_ROOT/processes-after-source.json"
          sudo greenroom-uid-process-inventory "$EVIDENCE_UID" "$process_after"
          sudo greenroom-tree-manifest "$EVIDENCE_HOME" "$CONTROL_ROOT/placeholder-home-final.json"
          sudo cmp -s "$CONTROL_ROOT/placeholder-home-initial.json" "$CONTROL_ROOT/placeholder-home-final.json"
          script="$TRUSTED_CHECKOUT/scripts/clean-source-evidence.mjs"
          status=0
          test "$(realpath "$TRUSTED_CHECKOUT")" = "$TRUSTED_CHECKOUT"
          test "$(realpath "$script")" = "$script"
          test "$(git -C "$TRUSTED_CHECKOUT" rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C "$TRUSTED_CHECKOUT" status --porcelain)"
          if sudo -u "$EVIDENCE_USER" test -w "$TRUSTED_CHECKOUT" ||
             sudo -u "$EVIDENCE_USER" test -w "$script" ||
             sudo -u "$EVIDENCE_USER" test -w "$(dirname "$TRUSTED_CHECKOUT")"; then
            echo "audited UID can mutate the trusted finalizer checkout" >&2
            exit 1
          fi
          for control_file in "$CONTROL_ROOT/audit-before.json" "$CONTROL_ROOT/audit-before-errors.log" "$CONTROL_ROOT/processes-baseline.json" "$process_before_snapshot" "$process_after" "$CONTROL_ROOT/provisioning-evidence.json" "$CONTROL_ROOT/placeholder-home-initial.json" "$CONTROL_ROOT/placeholder-home-final.json" "$after" "$errors"; do
            sudo /usr/local/bin/node -e 'const fs=require("node:fs"); const s=fs.lstatSync(process.argv[1]); if(s.uid!==0||(s.mode&0o777)!==0o600||!s.isFile()) process.exit(1)' "$control_file"
            if sudo -u "$EVIDENCE_USER" test -r "$control_file" ||
               sudo -u "$EVIDENCE_USER" test -w "$control_file"; then
              echo "audited UID can access $control_file" >&2
              exit 1
            fi
            sudo test -f "$control_file"
          done
          if sudo test -f "$script" && sudo test -f "$EVIDENCE_ROOT/evidence/harness-evidence.json"; then
            sudo env PATH="$EVIDENCE_TOOL_PATH" node "$script" finalize \
              --harness-evidence="$EVIDENCE_ROOT/evidence/harness-evidence.json" \
              --output-root="$CONTROL_ROOT/finalized" \
              --audit-before="$CONTROL_ROOT/audit-before.json" \
              --audit-after="$after" \
              --audit-before-errors="$CONTROL_ROOT/audit-before-errors.log" \
              --audit-after-errors="$errors" \
              --process-baseline="$CONTROL_ROOT/processes-baseline.json" \
              --process-pre-after-snapshot="$process_before_snapshot" \
              --process-after="$process_after" \
              --provisioning-evidence="$CONTROL_ROOT/provisioning-evidence.json" \
              --placeholder-initial="$CONTROL_ROOT/placeholder-home-initial.json" \
              --placeholder-final="$CONTROL_ROOT/placeholder-home-final.json" \
              --allowed-root="$EVIDENCE_ROOT" \
              --uid="$EVIDENCE_UID" \
              --repository="$SOURCE_REPOSITORY" \
              --sha="$SOURCE_SHA" || status=$?
          else
            echo "Harness evidence is unavailable; clone or harness startup failed." >&2
            status=1
          fi
          test ! -e "$UPLOAD_ROOT"
          sudo install -d -m 0700 -o root -g "$ROOT_GROUP" "$UPLOAD_ROOT"
          controlled=(
            "$CONTROL_ROOT/audit-before.json"
            "$CONTROL_ROOT/audit-before-errors.log"
            "$CONTROL_ROOT/processes-baseline.json"
            "$CONTROL_ROOT/processes-before-after-snapshot.json"
            "$CONTROL_ROOT/processes-after-source.json"
            "$CONTROL_ROOT/provisioning-evidence.json"
            "$CONTROL_ROOT/placeholder-home-initial.json"
            "$CONTROL_ROOT/placeholder-home-final.json"
            "$CONTROL_ROOT/audit-after.json"
            "$CONTROL_ROOT/audit-after-errors.log"
          )
          for stabilization in "$CONTROL_ROOT"/stabilization-*.json "$CONTROL_ROOT"/stabilization-*-errors.log; do
            if sudo test -f "$stabilization"; then controlled+=("$stabilization"); fi
          done
          for mount_inventory in "$CONTROL_ROOT/macos-mounts-before.json" "$CONTROL_ROOT/macos-mounts-after.json"; do
            if sudo test -f "$mount_inventory"; then controlled+=("$mount_inventory"); fi
          done
          for finalized in harness-evidence.json command-logs-manifest.json source-phase-write-audit.json final-evidence.json; do
            if sudo test -f "$CONTROL_ROOT/finalized/$finalized"; then
              controlled+=("$CONTROL_ROOT/finalized/$finalized")
            fi
          done
          manifest="$CONTROL_ROOT/artifact-sha256.txt"
          sudo rm -f "$manifest"
          for source in "${controlled[@]}"; do
            destination="$UPLOAD_ROOT/$(basename "$source")"
            sudo install -m 0600 -o root -g "$ROOT_GROUP" "$source" "$destination"
            sudo cmp -s "$source" "$destination"
            digest="$(sudo /usr/local/bin/node -e 'const fs=require("node:fs"),c=require("node:crypto"); process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$source")"
            size="$(sudo /usr/local/bin/node -e 'process.stdout.write(String(require("node:fs").statSync(process.argv[1]).size))' "$source")"
            printf '%s  %s  %s\n' "$digest" "$size" "$(basename "$source")" | sudo tee -a "$manifest" >/dev/null
          done
          if sudo test -f "$CONTROL_ROOT/finalized/command-logs-manifest.json"; then
            sudo install -d -m 0700 -o root -g "$ROOT_GROUP" "$UPLOAD_ROOT/logs"
            for log_name in 01-preflight.log 02-npm-ci.log 03-install-scripts.json 04-uv-sync.log 05-build.log 06-source-launcher.log 07-acceptance.log; do
              source="$CONTROL_ROOT/finalized/logs/$log_name"
              sudo /usr/local/bin/node -e 'const fs=require("node:fs"); const s=fs.lstatSync(process.argv[1]); if(!s.isFile()||s.isSymbolicLink()) process.exit(1)' "$source"
              destination="$UPLOAD_ROOT/logs/$log_name"
              sudo install -m 0600 -o root -g "$ROOT_GROUP" "$source" "$destination"
              sudo cmp -s "$source" "$destination"
              digest="$(sudo /usr/local/bin/node -e 'const fs=require("node:fs"),c=require("node:crypto"); process.stdout.write(c.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$source")"
              size="$(sudo /usr/local/bin/node -e 'process.stdout.write(String(require("node:fs").statSync(process.argv[1]).size))' "$source")"
              printf '%s  %s  %s\n' "$digest" "$size" "logs/$log_name" | sudo tee -a "$manifest" >/dev/null
            done
          fi
          sudo chmod 0600 "$manifest"
          sudo install -m 0600 -o root -g "$ROOT_GROUP" "$manifest" "$UPLOAD_ROOT/artifact-sha256.txt"
          sudo chown -R "$(id -u):$(id -g)" "$UPLOAD_ROOT"
          chmod 0700 "$UPLOAD_ROOT"
          find "$UPLOAD_ROOT" -type f -exec chmod 0600 {} +
          exit "$status"

      - name: Upload clean-source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clean-source-evidence-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/greenroom-clean-source-upload
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
